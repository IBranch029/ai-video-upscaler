name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install FFmpeg
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            curl -L --retry 3 -o ffmpeg.zip \
              https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            7z x ffmpeg.zip -o ffmpeg_extract
            mkdir -p bin
            cp ffmpeg_extract/*/bin/ffmpeg.exe ffmpeg_extract/*/bin/ffprobe.exe bin/
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Lint with ruff
        run: ruff check src tests scripts

      - name: Type check with mypy
        run: mypy src/aivideoupscaler --ignore-missing-imports

      - name: Run the test suite
        run: python -m pytest tests -q --cov=aivideoupscaler --cov-report=term-missing

      - name: Build the distribution
        run: python -m build
